name: Build LocalTTS (with Lecture video)

# Builds the app for Windows, macOS and Linux on GitHub's servers.
# - "Run workflow" (Actions tab): build + test; the files are attached to the run (log-in needed, kept 90 days).
# - Push a tag like v1.0: the same, then a public GitHub Release with the three downloads is created.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            flags: "--onefile --windowed"
            file: dist/LocalTTS.exe
          - os: macos-latest
            name: macos
            flags: "--windowed"
            file: dist/LocalTTS-macos.zip
          - os: ubuntu-22.04      # older Linux = runs on more distributions
            name: linux
            flags: "--onefile"
            file: dist/LocalTTS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test lecture video, import and batch
        run: |
          python tests/test_lecture_video.py
          python tests/test_import_batch.py
      - name: Build
        run: python -m PyInstaller ${{ matrix.flags }} --name LocalTTS --collect-all piper --collect-all kokoro_onnx --collect-all espeakng_loader --collect-all phonemizer --collect-all language_tags --collect-all localtts_lt --collect-all edge_tts --collect-all soundfile --collect-all _soundfile_data --collect-all imageio_ffmpeg --collect-all pypdfium2 --collect-all pypdfium2_raw localtts_gui.py
      # Runs the packaged app itself: makes a tiny video with the bundled ffmpeg, PDF renderer and
      # speech process (no network, stand-in voice). Fails the build if the shipped app can't do it.
      - name: Self-test the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\LocalTTS.exe -ArgumentList '--selftest', "$PWD\selftest" -Wait -PassThru
          Get-Content selftest\selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Self-test the built app (macOS)
        if: runner.os == 'macOS'
        run: code=0; dist/LocalTTS.app/Contents/MacOS/LocalTTS --selftest "$PWD/selftest" || code=$?; cat selftest/selftest.txt; exit $code
      - name: Self-test the built app (Linux)
        if: runner.os == 'Linux'
        run: code=0; dist/LocalTTS --selftest "$PWD/selftest" || code=$?; cat selftest/selftest.txt; exit $code
      - name: Package macOS app
        if: runner.os == 'macOS'
        # ditto keeps the symlinks and permissions inside the .app bundle (zip -r does not)
        run: cd dist && ditto -c -k --keepParent LocalTTS.app LocalTTS-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LocalTTS-${{ matrix.name }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  release:
    needs: build                  # only if all three builds and self-tests passed
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the downloads
        run: |
          mkdir release
          cp artifacts/LocalTTS-windows/LocalTTS.exe release/LocalTTS-windows.exe
          cp artifacts/LocalTTS-macos/LocalTTS-macos.zip release/LocalTTS-macos.zip
          chmod +x artifacts/LocalTTS-linux/LocalTTS
          tar -C artifacts/LocalTTS-linux -czf release/LocalTTS-linux.tar.gz LocalTTS
          cp LICENSE release/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md
          (cd release && sha256sum * > SHA256SUMS.txt)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY" --title "LocalTTS $GITHUB_REF_NAME"
          --notes-file .github/release_notes.md --generate-notes
